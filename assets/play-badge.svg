<svg xmlns="http://www.w3.org/2000/svg" width="524" height="74" viewBox="0 0 524 74" role="img" aria-label="Play the Moon Knight theme">
  <title>Play the Moon Knight theme — opens the player</title>
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#12141C"/>
      <stop offset="55%"  stop-color="#0A0B12"/>
      <stop offset="100%" stop-color="#15100A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5E4A12"/>
      <stop offset="45%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5E4A12"/>
    </linearGradient>
  </defs>
  <style>
    .ring1 { animation: r 3.4s ease-out infinite; transform-origin: 52px 37px; }
    .ring2 { animation: r 3.4s ease-out infinite 1.7s; transform-origin: 52px 37px; }
    @keyframes r { 0% { opacity:.75; transform:scale(.55) } 100% { opacity:0; transform:scale(1.9) } }
    /* fill-box keeps scaleY anchored to each bar's own base, not the SVG's */
    .bar { animation: eq 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    @keyframes eq { 0%,100% { transform:scaleY(.3) } 50% { transform:scaleY(1) } }
  </style>

  <rect x="1.5" y="1.5" width="521" height="71" rx="37" fill="url(#btn)"
        stroke="url(#edge)" stroke-width="1.6"/>

  <circle class="ring1" cx="52" cy="37" r="20" fill="none" stroke="#D4AF37" stroke-width="1.4"/>
  <circle class="ring2" cx="52" cy="37" r="20" fill="none" stroke="#D4AF37" stroke-width="1.4"/>
  <circle cx="52" cy="37" r="20" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".55"/>
  <path d="M56.5 37.6 a10 10 0 1 1 -9.8 -10 a7.7 7.7 0 1 0 9.8 10 z" fill="#E8E3D9"/>

  <text x="92" y="33" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5" letter-spacing="2.6" fill="#E8E3D9">PLAY THE MOON KNIGHT THEME</text>
  <text x="92" y="53" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.9" fill="#D4AF37" opacity=".72">HESHAM NAZIH &#183; OFFICIAL SOUNDTRACK</text>

  <g transform="translate(472,48)">
    <rect class="bar" x="0"  y="-16" width="3" height="16" fill="#D4AF37" opacity=".8" style="animation-delay:0s"/>
    <rect class="bar" x="6"  y="-16" width="3" height="16" fill="#D4AF37" opacity=".8" style="animation-delay:.18s"/>
    <rect class="bar" x="12" y="-16" width="3" height="16" fill="#D4AF37" opacity=".8" style="animation-delay:.36s"/>
    <rect class="bar" x="18" y="-16" width="3" height="16" fill="#D4AF37" opacity=".8" style="animation-delay:.54s"/>
  </g>
</svg>
